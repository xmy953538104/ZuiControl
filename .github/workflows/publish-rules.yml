name: Publish upstream Schema2/3 rules
run-name: Rules publisher · ${{ github.sha }}

on:
  push:
    paths:
      - 'scripts/rules/PublishRules*.py'
      - 'tests/zuiopt/TestRulePublisher.py'
      - '.github/workflows/publish-rules.yml'
  workflow_dispatch:
    inputs:
      source_path:
        description: Checked-in upstream source inside this checkout
        type: string
        default: payload/system/etc/zuiopt/factory_rules.conf
        required: true
      source_kind:
        description: Qualified static input grammar
        type: choice
        options: [canonical, appopt, recovered-csv]
        default: canonical
      source_name:
        description: Upstream provenance name
        type: string
        default: zuiopt-upstream
        required: true
      source_version:
        description: Explicit upstream source version
        type: string
        required: true
      source_date:
        description: Explicit upstream source date YYYY-MM-DD
        type: string
        required: true
      publish:
        description: Publish dedicated GitHub distribution branch after validation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic publisher and production native parser
        run: |
          set -euo pipefail
          clang++ -std=c++17 -O1 -Wall -Wextra -Werror tests/zuiopt/ZUIoptTest.cpp -lz -o "$RUNNER_TEMP/rules-native"
          python3 tests/zuiopt/TestRulePublisher.py "$RUNNER_TEMP/rules-native"

  distribute:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: upstream-rules-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Enforce manual publishing branch
        env:
          WANT_PUBLISH: ${{ inputs.publish }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$WANT_PUBLISH" != true || test "$REF_NAME" = "$DEFAULT_BRANCH"
      - name: Build or publish two-file upstream snapshot
        id: rules
        env:
          INPUT_SOURCE: ${{ inputs.source_path }}
          INPUT_KIND: ${{ inputs.source_kind }}
          INPUT_NAME: ${{ inputs.source_name }}
          INPUT_VERSION: ${{ inputs.source_version }}
          INPUT_DATE: ${{ inputs.source_date }}
          WANT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          options=()
          if [ "$WANT_PUBLISH" = true ]; then options+=(--publish); fi
          python3 scripts/rules/PublishRulesGit.py --input "$INPUT_SOURCE" --kind "$INPUT_KIND" \
            --source "$INPUT_NAME" --source-version "$INPUT_VERSION" --source-date "$INPUT_DATE" \
            "${options[@]}" | tee "$RUNNER_TEMP/publish-receipt.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'publish-receipt.json').read_text())
          print('commit='+receipt['publicationCommit'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/latest.json
            output/rules.conf
            ${{ runner.temp }}/publish-receipt.json
          if-no-files-found: warn
