name: Build ZuiControl

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "payload/**"
      - "native/**"
      - "framework_patch/**"
      - "scripts/**"
      - "tests/**"
      - "upstream/uperf/**"
      - ".github/workflows/build.yml"
      - "*.gradle.kts"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Test Uperf process-lifetime supervisor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uperf-supervisor-gate"
          python3 tests/uperf/supervisor/TestUperfSupervisor.py \
            --receipt-dir "$RUNNER_TEMP/uperf-supervisor-gate" 2>&1 | \
            tee "$RUNNER_TEMP/uperf-supervisor-gate/host_fixture_transcript.txt"

      - name: Rebuild and verify Android Uperf supervisor
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          output="$RUNNER_TEMP/zui_uperf_supervisor"
          "$toolchain/aarch64-linux-android34-clang" \
            -std=c11 -Os -fPIE -pie -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            -Wall -Wextra -Werror -Wl,-z,relro,-z,now,--build-id=none \
            native/zui_uperf_supervisor.c -o "$output"
          "$toolchain/llvm-strip" --strip-all "$output"
          cmp "$output" payload/system/bin/zui_uperf_supervisor
          sha256sum "$output" payload/system/bin/zui_uperf_supervisor | \
            tee "$RUNNER_TEMP/uperf-supervisor-gate/android_binary_sha256.txt"
          "$toolchain/llvm-readelf" -h -l "$output" > \
            "$RUNNER_TEMP/uperf-supervisor-gate/android_elf.txt"
          printf 'ANDROID_SUPERVISOR_REBUILD=PASS\n' > \
            "$RUNNER_TEMP/uperf-supervisor-gate/android_rebuild_result.txt"

      - name: Upload Uperf supervisor gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zui-control-supervisor-gate
          path: ${{ runner.temp }}/uperf-supervisor-gate
          if-no-files-found: error

      - name: Check scripts
        run: |
          python3 -m py_compile scripts/build/ApplyZuiControlPayload.py
          python3 -m py_compile scripts/build/PatchZuiControlFramework.py
          python3 -m py_compile scripts/build/ImportUperfUpstream.py
          python3 -m py_compile tests/selinux/TestUperfRuntimeAccess.py
          python3 -m py_compile tests/flash/VerifyFixedSevenReadback.py
          python3 -m py_compile scripts/build/PatchAsoulOptConfigPath.py
          python3 -m py_compile scripts/build/VerifiedContentCache.py
          python3 tests/cache/TestVerifiedContentCache.py
          python3 scripts/build/PatchAsoulOptConfigPath.py payload/system/bin/AsoulOpt
          bash -n payload/system/bin/zui_controld
          bash -n payload/system/bin/zui_uperf_service
          bash -n payload/system/etc/zui_control/zui_uperf_crash_gate.sh
          bash tests/command_plane/TestZuiControldTransactions.sh
          python3 tests/command_plane/TestCommandPlaneArchitecture.py
          python3 tests/refresh/TestRefreshStateMachine.py
          python3 tests/uperf/architecture/TestUperfArchitecture.py
          python3 tests/uperf/top_resumed/TestUperfTopResumedStateMachine.py
          python3 tests/uperf/startup/TestUperfStartupPolicy.py
          python3 tests/uperf/startup/TestUperfStartupBoundaries.py
          python3 tests/selinux/TestUperfRuntimeAccess.py \
            --mode source \
            --system-root payload/system \
            --file-contexts payload/patches/plat_file_contexts_add.txt \
            --property-contexts payload/patches/plat_property_contexts_add.txt \
            --plat-policy payload/patches/plat_sepolicy_zui_control.cil \
            --vendor-policy payload/patches/vendor_sepolicy_zui_scheduler.cil
          bash -n payload/system/etc/zui_control/zui_scheduler_prepare.sh
          python3 -m json.tool payload/system/etc/zui_control/uperf-sm8650.json >/dev/null

      - name: Download pinned Android 14 init verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/init-gate/receipt"
          python3 - <<'PY'
          import json
          import re
          import shutil
          import urllib.request

          page_url = (
              "https://ci.android.com/builds/submitted/16200779/"
              "aosp_arm64-userdebug/latest/otatools.zip"
          )
          with urllib.request.urlopen(page_url, timeout=60) as response:
              page = response.read().decode("utf-8")
          match = re.search(r"var JSVariables = (\{.*?\});", page, re.DOTALL)
          if match is None:
              raise SystemExit("Android CI artifact metadata was not found")
          metadata = json.loads(match.group(1))
          expected = {
              "artifact": "otatools.zip",
              "branch": "aosp-android14-gsi",
              "buildId": "16200779",
              "target": "aosp_arm64-userdebug",
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"Android CI metadata mismatch for {key}")
          with urllib.request.urlopen(metadata["artifactUrl"], timeout=120) as source:
              with open("otatools.zip", "wb") as destination:
                  shutil.copyfileobj(source, destination, length=1024 * 1024)
          with open("%s/init-gate/receipt/android_ci_source.txt" % __import__("os").environ["RUNNER_TEMP"], "w", encoding="utf-8") as out:
              out.write(f"artifact_page={page_url}\n")
              for key in ("branch", "buildId", "target", "artifact"):
                  out.write(f"{key}={metadata[key]}\n")
          PY
          unzip -q otatools.zip 'bin/host_init_verifier' 'lib64/*' -d "$RUNNER_TEMP/init-gate/otatools"
          chmod 0755 "$RUNNER_TEMP/init-gate/otatools/bin/host_init_verifier"
          verifier_sha="$(sha256sum "$RUNNER_TEMP/init-gate/otatools/bin/host_init_verifier" | cut -d' ' -f1)"
          printf '%s  host_init_verifier\n' "$verifier_sha" | tee "$RUNNER_TEMP/init-gate/receipt/host_init_verifier_sha256.txt"
          test "$verifier_sha" = b89a6d6351621a183b615e371f0390c38056644b640a8e829c4f4900379ec2e6

      - name: Verify Uperf init service with official host_init_verifier
        shell: bash
        run: |
          set -uo pipefail
          receipt="$RUNNER_TEMP/init-gate/receipt"
          sha256sum payload/system/etc/init/zui_scheduler.rc \
            tests/fixtures/host_init_property_contexts \
            > "$receipt/input_sha256.txt"
          cmd=(
            "$RUNNER_TEMP/init-gate/otatools/bin/host_init_verifier"
            -p /dev/null
            "--property-contexts=$PWD/tests/fixtures/host_init_property_contexts"
            "$PWD/payload/system/etc/init/zui_scheduler.rc"
          )
          printf '%q ' "${cmd[@]}" > "$receipt/argv.txt"
          printf '\n' >> "$receipt/argv.txt"
          set +e
          LD_LIBRARY_PATH="$RUNNER_TEMP/init-gate/otatools/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "${cmd[@]}" > "$receipt/stdout.txt" 2> "$receipt/stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$receipt/exit_code.txt"
          if [[ "$rc" -eq 0 ]]; then
            printf 'HOST_INIT_VERIFIER_UPERF_SERVICE=PASS\n' | tee "$receipt/result.txt"
          else
            printf 'HOST_INIT_VERIFIER_UPERF_SERVICE=FAIL\n' | tee "$receipt/result.txt"
          fi
          test "$rc" -eq 0

      - name: Upload init verifier receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zui-control-init-gate
          path: ${{ runner.temp }}/init-gate/receipt
          if-no-files-found: error

      - name: Decode release keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/ZuiControl-release.jks"

      - name: Test app
        run: gradle -p . :app:testDebugUnitTest :app:lintDebug

      - name: Build release APK
        run: |
          gradle -p . :app:assembleRelease \
            -Pzuicontrol.storeFile="$RUNNER_TEMP/ZuiControl-release.jks" \
            -Pzuicontrol.storePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pzuicontrol.keyAlias="${{ secrets.KEY_ALIAS }}" \
            -Pzuicontrol.keyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Stage payload APK
        run: |
          rm -rf payload/system/priv-app/ZuiControl payload/system/priv-app/ZuiControlV30 payload/system/priv-app/ZuiControlV31
          rm -rf payload/system/priv-app/ZuiControlV32 payload/system/priv-app/ZuiControlV33 payload/system/priv-app/ZuiControlV34
          rm -rf payload/system/priv-app/ZuiControlV35 payload/system/priv-app/ZuiControlV36 payload/system/priv-app/ZuiControlV37
          rm -rf payload/system/priv-app/ZuiControlV38 payload/system/priv-app/ZuiControlV39 payload/system/priv-app/ZuiControlV40
          rm -rf payload/system/priv-app/ZuiControlV41 payload/system/priv-app/ZuiControlV42 payload/system/priv-app/ZuiControlV43
          rm -rf payload/system/priv-app/ZuiControlV44 payload/system/priv-app/ZuiControlV45 payload/system/priv-app/ZuiControlV46
          rm -rf payload/system/priv-app/ZuiControlV47 payload/system/priv-app/ZuiControlV48
          mkdir -p payload/system/priv-app/ZuiControlV49
          cp app/build/outputs/apk/release/app-release.apk \
            payload/system/priv-app/ZuiControlV49/ZuiControl.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZuiControl-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: zui-control-payload
          path: payload
