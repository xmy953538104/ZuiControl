name: Build ZuiControl

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "payload/**"
      - "framework_patch/**"
      - "scripts/**"
      - "V20_3A_COMMAND_WAKEUP/tests/**"
      - ".github/workflows/build.yml"
      - "*.gradle.kts"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check scripts
        run: |
          python3 -m py_compile scripts/ApplyZuiControlPayload.py
          python3 -m py_compile scripts/PatchZuiControlFramework.py
          python3 -m py_compile tools/PatchAsoulOptConfigPath.py
          python3 tools/PatchAsoulOptConfigPath.py payload/system/bin/AsoulOpt
          bash -n payload/system/bin/zui_controld
          bash -n payload/system/bin/zui_uperf_service
          bash scripts/TestZuiControldTransactions.sh
          python3 V20_3A_COMMAND_WAKEUP/tests/TestV20_3APolicy.py
          bash -n payload/system/etc/zui_control/zui_scheduler_prepare.sh
          python3 -m json.tool payload/system/etc/zui_control/uperf-sm8650.json >/dev/null

      - name: Decode release keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/ZuiControl-release.jks"

      - name: Test app
        run: gradle -p . :app:testDebugUnitTest :app:lintDebug

      - name: Build release APK
        run: |
          gradle -p . :app:assembleRelease \
            -Pzuicontrol.storeFile="$RUNNER_TEMP/ZuiControl-release.jks" \
            -Pzuicontrol.storePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pzuicontrol.keyAlias="${{ secrets.KEY_ALIAS }}" \
            -Pzuicontrol.keyPassword="${{ secrets.KEY_PASSWORD }}"

      - name: Stage payload APK
        run: |
          rm -rf payload/system/priv-app/ZuiControl payload/system/priv-app/ZuiControlV30 payload/system/priv-app/ZuiControlV31
          rm -rf payload/system/priv-app/ZuiControlV32 payload/system/priv-app/ZuiControlV33 payload/system/priv-app/ZuiControlV34
          rm -rf payload/system/priv-app/ZuiControlV35 payload/system/priv-app/ZuiControlV36 payload/system/priv-app/ZuiControlV37
          rm -rf payload/system/priv-app/ZuiControlV38 payload/system/priv-app/ZuiControlV39 payload/system/priv-app/ZuiControlV40
          rm -rf payload/system/priv-app/ZuiControlV41 payload/system/priv-app/ZuiControlV42 payload/system/priv-app/ZuiControlV43
          rm -rf payload/system/priv-app/ZuiControlV44 payload/system/priv-app/ZuiControlV45 payload/system/priv-app/ZuiControlV46
          rm -rf payload/system/priv-app/ZuiControlV47 payload/system/priv-app/ZuiControlV48
          mkdir -p payload/system/priv-app/ZuiControlV49
          cp app/build/outputs/apk/release/app-release.apk \
            payload/system/priv-app/ZuiControlV49/ZuiControl.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZuiControl-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: zui-control-v19-payload
          path: payload
