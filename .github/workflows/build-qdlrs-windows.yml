name: Build Qualcomm qdl-rs for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Qualcomm qdlrs at audited commit
        shell: pwsh
        run: |
          git clone https://github.com/qualcomm/qdlrs.git qdlrs
          git -C qdlrs checkout 412f90bc08cc3a687d552ff599da29043c4f54f4

      - name: Build locked release binary
        run: cargo build --release --locked --package qdl-rs
        working-directory: qdlrs

      - name: Verify binary
        shell: pwsh
        run: |
          qdlrs\target\release\qdl-rs.exe --version
          Copy-Item qdlrs\LICENSE qdlrs\target\release\LICENSE-qdlrs.txt
          Set-Content qdlrs\target\release\SOURCE_COMMIT.txt 'qualcomm/qdlrs@412f90bc08cc3a687d552ff599da29043c4f54f4'

      - name: Upload Windows qdl-rs
        uses: actions/upload-artifact@v4
        with:
          name: qdl-rs-windows-x64-412f90b
          path: |
            qdlrs/target/release/qdl-rs.exe
            qdlrs/target/release/LICENSE-qdlrs.txt
            qdlrs/target/release/SOURCE_COMMIT.txt
          if-no-files-found: error
