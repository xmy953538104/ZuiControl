# AppOpt default configuration for ZuiControl.
# Lines starting with # are examples and do not take effect.
# A package line is the fallback for unmatched threads. Optional thread globs override it.
# Supported CPU sets: one core 0..7, or a contiguous X-Y range such as 2-7
# Examples only; use the ZuiControl UI to create active rules:
# com.kurogame.mingchao=2-6
# com.kurogame.mingchao{RenderThread}=2-4
# com.kurogame.mingchao{GameThread}=7
